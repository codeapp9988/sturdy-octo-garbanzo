<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer Pricing</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e222b;
    --border:#2a2f3a;
    --text:#e8eaed;
    --muted:#9aa2b1;
    --accent:#4f8cff;
    --accent-2:#6ee7b7;
    --accent-3:#ffb86b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
  }

  /* ---------- Lock screen ---------- */
  #lockScreen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 30% 20%, #1a1f2b, #0b0d11 70%);
    z-index:10;
  }
  .lock-card{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:36px 32px;
    width:320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align:center;
  }
  .lock-icon{
    width:48px;height:48px;
    margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    background: var(--panel-2);
    border-radius:50%;
    font-size:22px;
  }
  .lock-card h1{
    font-size:17px;
    margin:0 0 6px;
    font-weight:600;
  }
  .lock-card p{
    color:var(--muted);
    font-size:13px;
    margin:0 0 20px;
  }
  #pwInput{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background: var(--bg);
    color:var(--text);
    font-size:14px;
    outline:none;
    margin-bottom:12px;
  }
  #pwInput:focus{ border-color: var(--accent); }
  #unlockBtn{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:none;
    background: var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  #unlockBtn:hover{ opacity:0.92; }
  #errMsg{
    color:#ff6b6b;
    font-size:12.5px;
    margin-top:10px;
    min-height:16px;
  }

  /* ---------- Content ---------- */
  #content{
    display:none;
    max-width:760px;
    margin:0 auto;
    padding:40px 20px 60px;
  }
  header{
    margin-bottom:20px;
  }
  header h1{
    font-size:22px;
    margin:0 0 4px;
  }
  header p{
    color:var(--muted);
    font-size:13.5px;
    margin:0;
  }
  #searchInput{
    width:100%;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background: var(--panel);
    color:var(--text);
    font-size:13.5px;
    outline:none;
    margin-bottom:18px;
  }
  #searchInput:focus{ border-color: var(--accent); }
  .table-wrap{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  thead th{
    text-align:left;
    padding:13px 16px;
    background: var(--panel-2);
    color:var(--muted);
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    border-bottom:1px solid var(--border);
  }
  thead th.rate-col{ text-align:right; }
  tbody td{
    padding:11px 16px;
    border-bottom:1px solid var(--border);
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: rgba(255,255,255,0.02); }
  td.provider{
    font-weight:600;
  }
  td.rate{
    text-align:right;
    font-variant-numeric: tabular-nums;
    font-weight:600;
  }
  td.rate.no-agg{ color: var(--accent-3); }
  td.rate.agg{ color: var(--accent-2); }
  .footer-note{
    margin-top:18px;
    color:var(--muted);
    font-size:12px;
  }
  .dupe-note{
    margin-top:10px;
    padding:10px 14px;
    background: rgba(255,184,107,0.08);
    border:1px solid rgba(255,184,107,0.25);
    border-radius:8px;
    color: var(--accent-3);
    font-size:12px;
    display:none;
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h1>Protected Document</h1>
    <p>Enter the password to view streamer pricing.</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <div id="errMsg"></div>
  </div>
</div>

<div id="content">
  <header>
    <h1>Streamer Pricing</h1>
    <p>Commission without Total Aggregation vs. with Total Aggregation.</p>
  </header>

  <input type="text" id="searchInput" placeholder="Search provider...">

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Provider</th>
          <th class="rate-col">Without Total Aggregation</th>
          <th class="rate-col">With Total Aggregation</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer-note">Confidential — for internal use only.</div>
</div>

<script>
  // ---- Data ----
  const data = [
    { name: "Amatic", noAgg: 5, agg: 3 },
    { name: "Amusnet", noAgg: 4, agg: 2 },
    { name: "AvatarUX", noAgg: 0, agg: 0 },
    { name: "Betby", noAgg: 4, agg: 2 },
    { name: "BGaming", noAgg: 4, agg: 2 },
    { name: "Booongo", noAgg: 3, agg: 2 },
    { name: "CQ9", noAgg: 3, agg: 2 },
    { name: "EGT", noAgg: 4, agg: 2 },
    { name: "ELK Studios", noAgg: 5, agg: 3 },
    { name: "Evolution Gaming", noAgg: 5, agg: 3 },
    { name: "Evoplay", noAgg: 3, agg: 2 },
    { name: "Ezugi", noAgg: 0, agg: 0 },
    { name: "FA CHAI Gaming", noAgg: 4, agg: 2 },
    { name: "fastspin", noAgg: 3, agg: 2 },
    { name: "Gamzix", noAgg: 0, agg: 0 },
    { name: "Habanero", noAgg: 4, agg: 2 },
    { name: "Hacksaw Gaming", noAgg: 5, agg: 3 },
    { name: "ICONIC21 (former BETER Live)", noAgg: 0, agg: 0 },
    { name: "InOut", noAgg: 4, agg: 2 },
    { name: "NetEnt", noAgg: 4, agg: 2 },
    { name: "NetGame Entertainment", noAgg: 3, agg: 2 },
    { name: "Nolimit City", noAgg: 4, agg: 2 },
    { name: "Originals", noAgg: 0, agg: 0 },
    { name: "PG Soft", noAgg: 0, agg: 0 },
    { name: "Platipus", noAgg: 5, agg: 3 },
    { name: "Play'n'GO (PlaynGo)", noAgg: 5, agg: 3 },
    { name: "Playtech", noAgg: 5, agg: 3 },
    { name: "Pragmatic Play", noAgg: 0, agg: 0 },
    { name: "Pragmatic Play Live", noAgg: 0, agg: 0 },
    { name: "Push Gaming", noAgg: 5, agg: 3 },
    { name: "Relax Gaming", noAgg: 5, agg: 3 },
    { name: "Ruby Play", noAgg: 4, agg: 2 },
    { name: "ShadyLady", noAgg: 5, agg: 3 },
    { name: "Slotmill", noAgg: 4, agg: 2 },
    { name: "Spinomenal", noAgg: 4, agg: 2 },
    { name: "Spribe", noAgg: 5, agg: 3 },
    { name: "Yggdrasil", noAgg: 4, agg: 2 }
  ];

  function renderTable(filter = '') {
    const tbody = document.getElementById('tableBody');
    const f = filter.trim().toLowerCase();
    const rows = data.filter(row => row.name.toLowerCase().includes(f));
    tbody.innerHTML = rows.map(row => `
      <tr>
        <td class="provider">${row.name}</td>
        <td class="rate no-agg">${row.noAgg}%</td>
        <td class="rate agg">${row.agg}%</td>
      </tr>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    renderTable(e.target.value);
  });

  // ---- Password gate ----
  const PASSWORD = "confidentialbf";
  const pwInput = document.getElementById('pwInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const errMsg = document.getElementById('errMsg');
  const lockScreen = document.getElementById('lockScreen');
  const content = document.getElementById('content');

  function tryUnlock() {
    if (pwInput.value === PASSWORD) {
      lockScreen.style.display = 'none';
      content.style.display = 'block';
      renderTable();
    } else {
      errMsg.textContent = 'Incorrect password. Try again.';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });
  pwInput.focus();
</script>

</body>
</html>
